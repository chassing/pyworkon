<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700">
  <defs>
    <filter id="blur-bg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="20" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c2c2e" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1c1c1e" stop-opacity="0.80"/>
    </linearGradient>
    <linearGradient id="glass-border" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#555" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#333" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="session-active" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#30d158" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#30d158" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background: simulated desktop with code editor visible through -->
  <rect width="1100" height="700" fill="#1a1a1d"/>
  <!-- Simulated code in background -->
  <text x="40" y="80" fill="#636366" font-family="SF Mono, Menlo, monospace" font-size="12" opacity="0.4">def handle_request(self, request: Request) -> Response:</text>
  <text x="40" y="100" fill="#636366" font-family="SF Mono, Menlo, monospace" font-size="12" opacity="0.4">    match request.method:</text>
  <text x="40" y="120" fill="#636366" font-family="SF Mono, Menlo, monospace" font-size="12" opacity="0.4">        case "GET": return self.get(request)</text>
  <text x="40" y="140" fill="#636366" font-family="SF Mono, Menlo, monospace" font-size="12" opacity="0.4">        case "POST": return self.post(request)</text>
  <text x="40" y="180" fill="#636366" font-family="SF Mono, Menlo, monospace" font-size="12" opacity="0.4">class ProjectManager:</text>
  <text x="40" y="200" fill="#636366" font-family="SF Mono, Menlo, monospace" font-size="12" opacity="0.4">    def __init__(self, config: Config) -> None:</text>
  <text x="40" y="220" fill="#636366" font-family="SF Mono, Menlo, monospace" font-size="12" opacity="0.4">        self._projects: dict[str, Project] = {}</text>
  <text x="40" y="260" fill="#636366" font-family="SF Mono, Menlo, monospace" font-size="12" opacity="0.3">    async def sync_providers(self) -> None:</text>
  <text x="40" y="280" fill="#636366" font-family="SF Mono, Menlo, monospace" font-size="12" opacity="0.3">        for provider in self._providers:</text>
  <text x="40" y="300" fill="#636366" font-family="SF Mono, Menlo, monospace" font-size="12" opacity="0.3">            await provider.fetch_projects()</text>
  <text x="40" y="340" fill="#636366" font-family="SF Mono, Menlo, monospace" font-size="12" opacity="0.2">    def get_project(self, project_id: str) -> Project | None:</text>
  <text x="40" y="360" fill="#636366" font-family="SF Mono, Menlo, monospace" font-size="12" opacity="0.2">        return self._projects.get(project_id)</text>

  <!-- Title -->
  <text x="550" y="690" text-anchor="middle" fill="#8e8e93" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="13" font-weight="500">KONZEPT 2: Floating Glass HUD (Always-on-Top, semi-transparent)</text>

  <!-- Floating Glass Panel - positioned top-right corner -->
  <rect x="720" y="20" width="360" height="530" rx="16" fill="url(#glass-bg)" stroke="url(#glass-border)" stroke-width="0.5" filter="url(#shadow)"/>

  <!-- Glass highlight edge (top) -->
  <rect x="720" y="20" width="360" height="1" rx="16" fill="#fff" opacity="0.08"/>

  <!-- Header area -->
  <text x="740" y="50" fill="#e5e5ea" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="13" font-weight="600" opacity="0.9">pyworkon</text>
  <!-- Drag handle dots -->
  <circle cx="1040" cy="36" r="2" fill="#636366" opacity="0.5"/>
  <circle cx="1048" cy="36" r="2" fill="#636366" opacity="0.5"/>
  <circle cx="1056" cy="36" r="2" fill="#636366" opacity="0.5"/>
  <circle cx="1064" cy="36" r="2" fill="#636366" opacity="0.5"/>

  <!-- Separator -->
  <line x1="740" y1="58" x2="1060" y2="58" stroke="#48484a" stroke-width="0.5" opacity="0.5"/>

  <!-- Session 1: app-interface (compact inline) -->
  <rect x="736" y="66" width="328" height="96" rx="10" fill="#2c2c2e" opacity="0.5"/>
  <rect x="736" y="66" width="3" height="96" rx="1.5" fill="#30d158" opacity="0.8"/>
  <!-- Active glow -->
  <rect x="736" y="66" width="328" height="96" rx="10" fill="url(#session-active)"/>

  <circle cx="756" cy="84" r="4" fill="#30d158" filter="url(#glow-green)"/>
  <text x="770" y="88" fill="#e5e5ea" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="13" font-weight="600" opacity="0.95">app-interface</text>
  <!-- Provider icon area -->
  <rect x="1024" y="74" width="28" height="18" rx="4" fill="#48484a" opacity="0.3"/>
  <text x="1038" y="88" text-anchor="middle" fill="#8e8e93" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="10">GH</text>

  <text x="756" y="106" fill="#8e8e93" font-family="SF Mono, Menlo, monospace" font-size="10" opacity="0.8">fix-glitchtip-access-reporter</text>
  <text x="756" y="122" fill="#aeaeb2" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="10" opacity="0.7">fix output file path</text>
  <!-- CI status dot row -->
  <circle cx="756" cy="146" r="3" fill="#30d158" opacity="0.8"/>
  <text x="766" y="150" fill="#636366" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="9">#214624</text>
  <!-- Agent -->
  <circle cx="1004" cy="146" r="3" fill="#ff9f0a"/>
  <text x="1014" y="150" fill="#bf5af2" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="9" opacity="0.8">claude</text>

  <!-- Session 2: pyworkon (minimal - no PR) -->
  <rect x="736" y="172" width="328" height="48" rx="10" fill="#2c2c2e" opacity="0.4"/>
  <circle cx="756" cy="192" r="4" fill="#30d158" opacity="0.6"/>
  <text x="770" y="196" fill="#e5e5ea" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="13" font-weight="600" opacity="0.7">pyworkon</text>
  <text x="756" y="212" fill="#8e8e93" font-family="SF Mono, Menlo, monospace" font-size="10" opacity="0.5">main</text>

  <!-- Session 3: qontract-reconcile (has failures - attention) -->
  <rect x="736" y="230" width="328" height="172" rx="10" fill="#2c2c2e" opacity="0.5"/>
  <rect x="736" y="230" width="3" height="172" rx="1.5" fill="#ff453a" opacity="0.8"/>
  <!-- Failure glow -->
  <rect x="736" y="230" width="328" height="2" rx="1" fill="#ff453a" opacity="0.15"/>

  <circle cx="756" cy="250" r="4" fill="#30d158"/>
  <text x="770" y="254" fill="#e5e5ea" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="13" font-weight="600" opacity="0.95">qontract-reconcile</text>
  <text x="756" y="272" fill="#8e8e93" font-family="SF Mono, Menlo, monospace" font-size="10" opacity="0.8">LDAP-membership-sources-...</text>
  <text x="756" y="288" fill="#aeaeb2" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="10" opacity="0.7">resolve LDAP role memberships</text>

  <!-- CI failures inline -->
  <circle cx="756" cy="308" r="3" fill="#ff453a"/>
  <text x="766" y="312" fill="#ff453a" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="9" opacity="0.9">3 failed</text>
  <circle cx="820" cy="308" r="3" fill="#30d158" opacity="0.5"/>
  <text x="830" y="312" fill="#636366" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="9">8 passed</text>

  <!-- Compact CI check list -->
  <text x="768" y="330" fill="#ff453a" font-family="SF Mono, Menlo, monospace" font-size="9" opacity="0.7">x  opa-master-on-pull-request</text>
  <text x="768" y="344" fill="#ff453a" font-family="SF Mono, Menlo, monospace" font-size="9" opacity="0.7">x  qontract-api-client-master</text>
  <text x="768" y="358" fill="#ff453a" font-family="SF Mono, Menlo, monospace" font-size="9" opacity="0.7">x  reconcile-fips-master-on-pr</text>

  <!-- Collapsed success checks -->
  <text x="768" y="378" fill="#636366" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="9" opacity="0.5">8 passing checks hidden</text>

  <!-- Agent with working spinner -->
  <circle cx="756" cy="396" r="3" fill="#30d158"/>
  <text x="766" y="400" fill="#bf5af2" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="9" opacity="0.8">claude-38026</text>
  <text x="1048" y="400" text-anchor="end" fill="#ff453a" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="9" opacity="0.8">working</text>

  <!-- Session 4: sre-capabilities (draft, dimmed) -->
  <rect x="736" y="412" width="328" height="70" rx="10" fill="#2c2c2e" opacity="0.3"/>
  <circle cx="756" cy="432" r="4" fill="#30d158" opacity="0.4"/>
  <text x="770" y="436" fill="#e5e5ea" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="13" font-weight="600" opacity="0.5">sre-capabilities</text>
  <rect x="898" y="425" width="42" height="16" rx="8" fill="#636366" opacity="0.2"/>
  <text x="919" y="437" text-anchor="middle" fill="#8e8e93" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="9" opacity="0.5">Draft</text>
  <text x="756" y="452" fill="#8e8e93" font-family="SF Mono, Menlo, monospace" font-size="10" opacity="0.4">ROSAENG-67952</text>
  <text x="756" y="468" fill="#aeaeb2" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="10" opacity="0.4">Migrate SRE capabilities docs</text>

  <!-- Mini mode toggle hint -->
  <rect x="736" y="496" width="328" height="36" rx="10" fill="#48484a" opacity="0.15"/>
  <text x="900" y="518" text-anchor="middle" fill="#636366" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="10">Cmd+Shift+P  mini mode  |  drag to reposition  |  scroll to resize</text>

  <!-- Annotations -->
  <line x1="700" y1="100" x2="736" y2="100" stroke="#0a84ff" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
  <text x="30" y="70" fill="#0a84ff" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="12" font-weight="500">Always-on-Top Glass Panel</text>
  <text x="30" y="88" fill="#636366" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="11">Schwebt uber allen Fenstern.</text>
  <text x="30" y="103" fill="#636366" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="11">Code bleibt durchsichtig sichtbar.</text>
  <text x="30" y="118" fill="#636366" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="11">macOS Vibrancy/Blur Material.</text>
  <text x="30" y="133" fill="#636366" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="11">Frei positionierbar per Drag.</text>

  <text x="30" y="220" fill="#30d158" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="12" font-weight="500">Mini Mode</text>
  <text x="30" y="238" fill="#636366" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="11">Collapsible auf nur Status-Dots:</text>
  <!-- Mini mode preview -->
  <rect x="30" y="250" width="180" height="28" rx="8" fill="#2c2c2e" opacity="0.7" stroke="#48484a" stroke-width="0.5"/>
  <circle cx="50" cy="264" r="4" fill="#30d158"/>
  <circle cx="64" cy="264" r="4" fill="#30d158"/>
  <circle cx="78" cy="264" r="4" fill="#ff453a"/>
  <circle cx="92" cy="264" r="4" fill="#636366" opacity="0.5"/>
  <text x="110" y="268" fill="#636366" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="10">4 sessions</text>

  <text x="30" y="320" fill="#ff9f0a" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="12" font-weight="500">Interaktion</text>
  <text x="30" y="338" fill="#636366" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="11">Klick = Switch to tmux session</text>
  <text x="30" y="353" fill="#636366" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="11">Hover = Expand details</text>
  <text x="30" y="368" fill="#636366" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="11">Scroll = Resize panel</text>
  <text x="30" y="383" fill="#636366" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="11">Mouse-through wenn inaktiv</text>

  <text x="30" y="440" fill="#bf5af2" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="12" font-weight="500">Technologie</text>
  <text x="30" y="458" fill="#636366" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="11">Swift NSPanel + NSVisualEffectView</text>
  <text x="30" y="473" fill="#636366" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="11">floatingPanel = true</text>
  <text x="30" y="488" fill="#636366" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="11">hidesOnDeactivate = false</text>
  <text x="30" y="503" fill="#636366" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="11">Level: .floating oder .statusBar</text>
  <text x="30" y="518" fill="#636366" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="11">WebView fur HTML rendering</text>
  <text x="30" y="533" fill="#636366" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="11">(reuse relay dashboard.html!)</text>
</svg>