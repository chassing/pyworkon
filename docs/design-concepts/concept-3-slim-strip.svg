<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <filter id="shadow" x="-5%" y="-10%" width="115%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="strip-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c2c2e" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#1c1c1e" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="active-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#30d158" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#30d158" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="fail-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff453a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ff453a" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <!-- Background desktop -->
  <rect width="1200" height="700" fill="#1a1a1d"/>

  <!-- Simulated VS Code -->
  <rect x="20" y="60" width="1160" height="540" rx="8" fill="#1e1e1e" opacity="0.3"/>
  <rect x="20" y="60" width="1160" height="32" rx="8" fill="#2d2d2d" opacity="0.3"/>
  <text x="50" y="82" fill="#636366" font-family="-apple-system, sans-serif" font-size="12" opacity="0.3">VS Code - pyworkon</text>

  <!-- Title -->
  <text x="600" y="690" text-anchor="middle" fill="#8e8e93" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="13" font-weight="500">KONZEPT 3: Slim Strip (Horizontal Bar am unteren Bildschirmrand)</text>

  <!-- ===== VARIANT A: Bottom Strip ===== -->
  <rect x="20" y="610" width="1160" height="56" rx="12" fill="url(#strip-bg)" filter="url(#shadow)"/>

  <!-- Strip header -->
  <text x="40" y="642" fill="#636366" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="10" font-weight="600" letter-spacing="1">PW</text>
  <line x1="62" y1="624" x2="62" y2="654" stroke="#48484a" stroke-width="0.5" opacity="0.5"/>

  <!-- Session Chip 1: app-interface -->
  <rect x="74" y="622" width="240" height="34" rx="8" fill="url(#active-card)" stroke="#30d158" stroke-width="0.5" stroke-opacity="0.3"/>
  <circle cx="92" cy="639" r="4" fill="#30d158"/>
  <text x="104" y="635" fill="#e5e5ea" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="11" font-weight="600">app-interface</text>
  <text x="104" y="650" fill="#8e8e93" font-family="SF Mono, Menlo, monospace" font-size="9">fix-glitchtip  #214624</text>
  <!-- Status pills -->
  <rect x="258" y="628" width="18" height="12" rx="6" fill="#30d158" opacity="0.2"/>
  <text x="267" y="638" text-anchor="middle" fill="#30d158" font-family="-apple-system, sans-serif" font-size="7">CI</text>
  <rect x="280" y="628" width="24" height="12" rx="6" fill="#bf5af2" opacity="0.2"/>
  <text x="292" y="638" text-anchor="middle" fill="#bf5af2" font-family="-apple-system, sans-serif" font-size="7">AI</text>

  <!-- Session Chip 2: pyworkon -->
  <rect x="326" y="622" width="130" height="34" rx="8" fill="#3a3a3c" opacity="0.4"/>
  <circle cx="344" cy="639" r="4" fill="#30d158" opacity="0.5"/>
  <text x="356" y="635" fill="#e5e5ea" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="11" font-weight="600" opacity="0.6">pyworkon</text>
  <text x="356" y="650" fill="#8e8e93" font-family="SF Mono, Menlo, monospace" font-size="9" opacity="0.5">main</text>

  <!-- Session Chip 3: qontract-reconcile (failure) -->
  <rect x="468" y="622" width="300" height="34" rx="8" fill="url(#fail-card)" stroke="#ff453a" stroke-width="0.5" stroke-opacity="0.3"/>
  <circle cx="486" cy="639" r="4" fill="#30d158"/>
  <text x="498" y="635" fill="#e5e5ea" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="11" font-weight="600">qontract-reconcile</text>
  <text x="498" y="650" fill="#8e8e93" font-family="SF Mono, Menlo, monospace" font-size="9">LDAP-membership  #5859</text>
  <!-- Failure badge -->
  <rect x="700" y="628" width="30" height="12" rx="6" fill="#ff453a" opacity="0.2"/>
  <text x="715" y="638" text-anchor="middle" fill="#ff453a" font-family="-apple-system, sans-serif" font-size="7">3 x</text>
  <rect x="734" y="628" width="24" height="12" rx="6" fill="#bf5af2" opacity="0.2"/>
  <text x="746" y="638" text-anchor="middle" fill="#bf5af2" font-family="-apple-system, sans-serif" font-size="7">AI</text>

  <!-- Session Chip 4: sre-capabilities (draft) -->
  <rect x="780" y="622" width="200" height="34" rx="8" fill="#3a3a3c" opacity="0.3"/>
  <circle cx="798" cy="639" r="4" fill="#30d158" opacity="0.4"/>
  <text x="810" y="635" fill="#e5e5ea" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="11" font-weight="600" opacity="0.5">sre-capabilities</text>
  <text x="810" y="650" fill="#8e8e93" font-family="SF Mono, Menlo, monospace" font-size="9" opacity="0.4">ROSAENG-67952</text>
  <rect x="936" y="628" width="32" height="12" rx="6" fill="#636366" opacity="0.2"/>
  <text x="952" y="638" text-anchor="middle" fill="#636366" font-family="-apple-system, sans-serif" font-size="7">Draft</text>

  <!-- Right side: global actions -->
  <line x1="1040" y1="624" x2="1040" y2="654" stroke="#48484a" stroke-width="0.5" opacity="0.5"/>
  <text x="1060" y="636" fill="#636366" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="18">+</text>
  <text x="1100" y="636" fill="#636366" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="12">...</text>

  <!-- ===== Expanded popup (hover on qontract-reconcile) ===== -->
  <rect x="468" y="380" width="330" height="224" rx="12" fill="#2c2c2e" filter="url(#shadow)" opacity="0.95"/>
  <rect x="468" y="380" width="330" height="1" rx="0.5" fill="#fff" opacity="0.05"/>
  <!-- Arrow pointing down -->
  <polygon points="590,604 580,610 600,610" fill="#2c2c2e" opacity="0.95"/>

  <text x="488" y="406" fill="#e5e5ea" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="13" font-weight="600">qontract-reconcile</text>
  <text x="488" y="424" fill="#8e8e93" font-family="SF Mono, Menlo, monospace" font-size="10">LDAP-membership-sources-notifications</text>
  <text x="488" y="442" fill="#aeaeb2" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="11">resolve LDAP role memberships for CLI</text>
  <text x="488" y="458" fill="#0a84ff" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="11" text-decoration="underline">qontract-reconcile#5859</text>

  <line x1="488" y1="468" x2="778" y2="468" stroke="#48484a" stroke-width="0.5" opacity="0.3"/>

  <!-- CI details -->
  <text x="488" y="486" fill="#ff453a" font-family="SF Mono, Menlo, monospace" font-size="10">x  opa-master-on-pull-request</text>
  <text x="488" y="502" fill="#ff453a" font-family="SF Mono, Menlo, monospace" font-size="10">x  qontract-api-client-master</text>
  <text x="488" y="518" fill="#ff453a" font-family="SF Mono, Menlo, monospace" font-size="10">x  reconcile-fips-master-on-pr</text>
  <text x="488" y="538" fill="#30d158" font-family="SF Mono, Menlo, monospace" font-size="10" opacity="0.6">ok reconcile-main-enterprise (x8)</text>

  <line x1="488" y1="548" x2="778" y2="548" stroke="#48484a" stroke-width="0.5" opacity="0.3"/>

  <!-- Agent info in popup -->
  <circle cx="498" cy="566" r="3" fill="#30d158"/>
  <text x="508" y="570" fill="#bf5af2" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="10">claude-38026</text>
  <text x="748" y="570" fill="#ff9f0a" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="10" opacity="0.8">working</text>

  <!-- Action buttons in popup -->
  <rect x="488" y="580" width="80" height="20" rx="4" fill="#0a84ff" opacity="0.15"/>
  <text x="528" y="594" text-anchor="middle" fill="#0a84ff" font-family="-apple-system, sans-serif" font-size="10">Switch</text>
  <rect x="578" y="580" width="80" height="20" rx="4" fill="#48484a" opacity="0.3"/>
  <text x="618" y="594" text-anchor="middle" fill="#8e8e93" font-family="-apple-system, sans-serif" font-size="10">Open PR</text>

  <!-- Annotations -->
  <text x="30" y="40" fill="#0a84ff" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="14" font-weight="600">Slim Strip Konzept</text>

  <text x="30" y="160" fill="#30d158" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="12" font-weight="500">Vorteile</text>
  <text x="30" y="178" fill="#636366" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="11">Nur 56px hoch, minimal invasiv</text>
  <text x="30" y="193" fill="#636366" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="11">Alle Sessions auf einen Blick</text>
  <text x="30" y="208" fill="#636366" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="11">Hover zeigt Details als Popup</text>
  <text x="30" y="223" fill="#636366" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="11">Auto-hide Option (wie Dock)</text>
  <text x="30" y="238" fill="#636366" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="11">Failure sofort sichtbar (roter Rand)</text>

  <text x="30" y="290" fill="#ff9f0a" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="12" font-weight="500">Positionen</text>
  <!-- Position options -->
  <rect x="30" y="305" width="160" height="80" rx="6" fill="#2c2c2e" stroke="#48484a" stroke-width="0.5"/>
  <rect x="36" y="310" width="148" height="8" rx="3" fill="#0a84ff" opacity="0.3"/>
  <text x="110" y="358" text-anchor="middle" fill="#636366" font-family="-apple-system, sans-serif" font-size="9">Top (unter Menubar)</text>

  <rect x="210" y="305" width="160" height="80" rx="6" fill="#2c2c2e" stroke="#48484a" stroke-width="0.5"/>
  <rect x="216" y="373" width="148" height="8" rx="3" fill="#30d158" opacity="0.3"/>
  <text x="290" y="358" text-anchor="middle" fill="#636366" font-family="-apple-system, sans-serif" font-size="9">Bottom (uber Dock)</text>

  <text x="30" y="430" fill="#bf5af2" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="12" font-weight="500">Technologie</text>
  <text x="30" y="448" fill="#636366" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="11">Tauri v2 + HTML/CSS/JS</text>
  <text x="30" y="463" fill="#636366" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="11">Reuse relay dashboard.html</text>
  <text x="30" y="478" fill="#636366" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="11">oder SwiftUI + WebView</text>
  <text x="30" y="493" fill="#636366" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="11">window.setAlwaysOnTop(true)</text>
</svg>