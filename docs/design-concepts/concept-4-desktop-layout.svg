<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c2c2e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1c1c1e" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="#0d0d0f"/>

  <text x="600" y="36" text-anchor="middle" fill="#e5e5ea" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="16" font-weight="600">KONZEPT 4: Desktop Layout Vorschlaege</text>

  <!-- ===== Layout A: Current (Problem) ===== -->
  <text x="175" y="76" text-anchor="middle" fill="#ff453a" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="13" font-weight="600">A: Aktuell (Problem)</text>

  <rect x="30" y="92" width="290" height="180" rx="6" fill="#1e1e1e" stroke="#48484a" stroke-width="0.5"/>
  <!-- Menu bar -->
  <rect x="30" y="92" width="290" height="14" rx="6" fill="#3a3a3c"/>
  <!-- Dashboard window -->
  <rect x="34" y="110" width="70" height="158" rx="3" fill="#1a2332" stroke="#30d158" stroke-width="1" opacity="0.8"/>
  <text x="69" y="150" text-anchor="middle" fill="#30d158" font-family="-apple-system, sans-serif" font-size="7" transform="rotate(-90, 69, 150)">Dashboard</text>
  <!-- Browser overlapping -->
  <rect x="60" y="115" width="140" height="130" rx="3" fill="#2d2d2d" stroke="#636366" stroke-width="0.5" opacity="0.9"/>
  <text x="130" y="175" text-anchor="middle" fill="#636366" font-family="-apple-system, sans-serif" font-size="8">Browser</text>
  <!-- VS Code -->
  <rect x="180" y="110" width="136" height="158" rx="3" fill="#1e1e1e" stroke="#636366" stroke-width="0.5"/>
  <text x="248" y="190" text-anchor="middle" fill="#636366" font-family="-apple-system, sans-serif" font-size="8">VS Code</text>

  <!-- Red X -->
  <text x="165" y="296" text-anchor="middle" fill="#ff453a" font-family="-apple-system, SF Pro Display, sans-serif" font-size="11">Dashboard wird verdeckt!</text>

  <!-- ===== Layout B: Tiling with yabai ===== -->
  <text x="600" y="76" text-anchor="middle" fill="#30d158" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="13" font-weight="600">B: Tiling WM (yabai/Aerospace)</text>

  <rect x="450" y="92" width="300" height="180" rx="6" fill="#1e1e1e" stroke="#48484a" stroke-width="0.5"/>
  <rect x="450" y="92" width="300" height="14" rx="6" fill="#3a3a3c"/>
  <!-- Tiled layout -->
  <rect x="454" y="110" width="145" height="158" rx="3" fill="#1e1e1e" stroke="#0a84ff" stroke-width="1"/>
  <text x="526" y="190" text-anchor="middle" fill="#0a84ff" font-family="-apple-system, sans-serif" font-size="8">VS Code</text>
  <rect x="603" y="110" width="143" height="100" rx="3" fill="#2d2d2d" stroke="#ff9f0a" stroke-width="1"/>
  <text x="674" y="165" text-anchor="middle" fill="#ff9f0a" font-family="-apple-system, sans-serif" font-size="8">Browser</text>
  <rect x="603" y="214" width="143" height="54" rx="3" fill="#1a2332" stroke="#30d158" stroke-width="1"/>
  <text x="674" y="245" text-anchor="middle" fill="#30d158" font-family="-apple-system, sans-serif" font-size="7">Dashboard (floating)</text>

  <text x="600" y="296" text-anchor="middle" fill="#636366" font-family="-apple-system, sans-serif" font-size="11">Automatische Anordnung, Dashboard sticky</text>

  <!-- ===== Layout C: Multiple Spaces ===== -->
  <text x="1020" y="76" text-anchor="middle" fill="#0a84ff" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="13" font-weight="600">C: macOS Spaces + Swipe</text>

  <rect x="870" y="92" width="300" height="180" rx="6" fill="#1e1e1e" stroke="#48484a" stroke-width="0.5"/>
  <rect x="870" y="92" width="300" height="14" rx="6" fill="#3a3a3c"/>
  <!-- Space indicators -->
  <rect x="970" y="95" width="6" height="6" rx="3" fill="#fff" opacity="0.8"/>
  <rect x="982" y="95" width="6" height="6" rx="3" fill="#fff" opacity="0.3"/>
  <rect x="994" y="95" width="6" height="6" rx="3" fill="#fff" opacity="0.3"/>
  <!-- Main workspace -->
  <rect x="874" y="110" width="196" height="158" rx="3" fill="#1e1e1e" stroke="#0a84ff" stroke-width="0.5"/>
  <text x="972" y="190" text-anchor="middle" fill="#636366" font-family="-apple-system, sans-serif" font-size="8">VS Code + Browser</text>
  <!-- Peek of next space -->
  <rect x="1074" y="110" width="92" height="158" rx="3" fill="#1a2332" opacity="0.4" stroke="#30d158" stroke-width="0.5"/>
  <text x="1120" y="185" text-anchor="middle" fill="#30d158" font-family="-apple-system, sans-serif" font-size="7" opacity="0.5">Dashboard</text>
  <!-- Swipe arrow -->
  <text x="1040" y="200" fill="#0a84ff" font-family="-apple-system, sans-serif" font-size="18" opacity="0.6">></text>

  <text x="1020" y="296" text-anchor="middle" fill="#636366" font-family="-apple-system, sans-serif" font-size="11">Trackpad-Swipe zum Dashboard</text>

  <!-- ===== RECOMMENDED LAYOUT ===== -->
  <text x="600" y="350" text-anchor="middle" fill="#ff9f0a" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="16" font-weight="700">EMPFEHLUNG: Hybrid-Ansatz</text>

  <!-- Large mockup of recommended layout -->
  <rect x="100" y="375" width="1000" height="390" rx="10" fill="#1e1e1e" stroke="#48484a" stroke-width="1"/>
  <!-- Menu bar -->
  <rect x="100" y="375" width="1000" height="24" rx="10" fill="#3a3a3c"/>
  <text x="120" y="391" fill="#e5e5ea" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">Finder</text>
  <!-- pyworkon in menu bar -->
  <rect x="890" y="379" width="22" height="16" rx="3" fill="#48484a"/>
  <text x="901" y="392" text-anchor="middle" fill="#30d158" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">P</text>
  <circle cx="920" cy="387" r="2.5" fill="#30d158"/>
  <circle cx="928" cy="387" r="2.5" fill="#ff453a"/>
  <circle cx="936" cy="387" r="2.5" fill="#30d158"/>

  <!-- Main work area -->
  <!-- VS Code left -->
  <rect x="106" y="403" width="540" height="354" rx="4" fill="#1e1e2e" stroke="#0a84ff" stroke-width="0.5"/>
  <rect x="106" y="403" width="540" height="20" rx="4" fill="#2d2d3e"/>
  <text x="376" y="417" text-anchor="middle" fill="#636366" font-family="-apple-system, sans-serif" font-size="9">VS Code / Terminal</text>
  <!-- Simulated code -->
  <text x="120" y="445" fill="#636366" font-family="SF Mono, monospace" font-size="8" opacity="0.4">class DaemonServer:</text>
  <text x="120" y="458" fill="#636366" font-family="SF Mono, monospace" font-size="8" opacity="0.3">    async def handle_command(self):</text>
  <text x="120" y="471" fill="#636366" font-family="SF Mono, monospace" font-size="8" opacity="0.3">        match cmd.type:</text>
  <!-- Terminal pane at bottom -->
  <rect x="106" y="620" width="540" height="137" rx="0" fill="#1a1a1d"/>
  <line x1="106" y1="620" x2="646" y2="620" stroke="#48484a" stroke-width="0.5"/>
  <text x="120" y="640" fill="#30d158" font-family="SF Mono, monospace" font-size="8" opacity="0.5">$ claude</text>
  <text x="120" y="655" fill="#636366" font-family="SF Mono, monospace" font-size="8" opacity="0.3">Claude Code v3.1.166</text>

  <!-- Browser right -->
  <rect x="652" y="403" width="442" height="354" rx="4" fill="#2d2d2d" stroke="#ff9f0a" stroke-width="0.5"/>
  <rect x="652" y="403" width="442" height="20" rx="4" fill="#3a3a3a"/>
  <text x="873" y="417" text-anchor="middle" fill="#636366" font-family="-apple-system, sans-serif" font-size="9">Browser (Konflux / GitLab / GitHub)</text>

  <!-- Floating HUD overlay in top-right corner -->
  <rect x="820" y="435" width="260" height="220" rx="12" fill="url(#glass)" filter="url(#shadow)" opacity="0.92"/>
  <rect x="820" y="435" width="260" height="1" rx="0.5" fill="#fff" opacity="0.06"/>

  <text x="840" y="456" fill="#e5e5ea" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" opacity="0.8">pyworkon</text>
  <circle cx="1054" cy="450" r="3" fill="#636366" opacity="0.4"/>
  <circle cx="1064" cy="450" r="3" fill="#636366" opacity="0.4"/>

  <!-- Compact session rows -->
  <rect x="832" y="464" width="236" height="38" rx="6" fill="#3a3a3c" opacity="0.3"/>
  <circle cx="846" cy="479" r="3" fill="#30d158"/>
  <text x="856" y="476" fill="#e5e5ea" font-family="-apple-system, sans-serif" font-size="10" font-weight="500" opacity="0.9">app-interface</text>
  <text x="856" y="492" fill="#8e8e93" font-family="SF Mono, monospace" font-size="8" opacity="0.6">fix-glitchtip  #214624</text>
  <rect x="1020" y="470" width="36" height="14" rx="7" fill="#30d158" opacity="0.15"/>
  <text x="1038" y="480" text-anchor="middle" fill="#30d158" font-family="-apple-system, sans-serif" font-size="7">OK</text>

  <rect x="832" y="506" width="236" height="28" rx="6" fill="#3a3a3c" opacity="0.2"/>
  <circle cx="846" cy="520" r="3" fill="#30d158" opacity="0.4"/>
  <text x="856" y="524" fill="#e5e5ea" font-family="-apple-system, sans-serif" font-size="10" opacity="0.5">pyworkon</text>

  <rect x="832" y="538" width="236" height="38" rx="6" fill="#3a3a3c" opacity="0.3" stroke="#ff453a" stroke-width="0.5" stroke-opacity="0.3"/>
  <circle cx="846" cy="553" r="3" fill="#30d158"/>
  <text x="856" y="550" fill="#e5e5ea" font-family="-apple-system, sans-serif" font-size="10" font-weight="500" opacity="0.9">qontract-reconcile</text>
  <text x="856" y="566" fill="#8e8e93" font-family="SF Mono, monospace" font-size="8" opacity="0.6">LDAP-membership  #5859</text>
  <rect x="1020" y="544" width="36" height="14" rx="7" fill="#ff453a" opacity="0.15"/>
  <text x="1038" y="554" text-anchor="middle" fill="#ff453a" font-family="-apple-system, sans-serif" font-size="7">3x</text>

  <rect x="832" y="580" width="236" height="28" rx="6" fill="#3a3a3c" opacity="0.15"/>
  <circle cx="846" cy="594" r="3" fill="#30d158" opacity="0.3"/>
  <text x="856" y="598" fill="#e5e5ea" font-family="-apple-system, sans-serif" font-size="10" opacity="0.4">sre-capabilities</text>
  <rect x="950" y="588" width="32" height="14" rx="7" fill="#636366" opacity="0.15"/>
  <text x="966" y="598" text-anchor="middle" fill="#636366" font-family="-apple-system, sans-serif" font-size="7">Draft</text>

  <!-- Mini collapse hint -->
  <text x="900" y="640" text-anchor="middle" fill="#636366" font-family="-apple-system, sans-serif" font-size="8" opacity="0.5">Cmd+Shift+P toggle | drag to move | scroll to resize</text>

  <!-- Annotation: The combined approach -->
  <rect x="110" y="680" width="980" height="70" rx="8" fill="#2c2c2e" opacity="0.5"/>
  <text x="130" y="700" fill="#ff9f0a" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="12" font-weight="600">Menu Bar + Floating HUD = Bester Kompromiss</text>
  <text x="130" y="718" fill="#aeaeb2" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="11">Menu Bar: Status-Dots zeigen sofort ob alles OK. Klick offnet Full Panel fur Details.</text>
  <text x="130" y="736" fill="#aeaeb2" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="11">Floating HUD: Optionaler Always-on-Top Kompakt-View. Auto-hide oder Mini-Mode (nur Dots). Cmd+Shift+P toggle.</text>
</svg>