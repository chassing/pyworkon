[project]
name = "pyworkon"
version = "0.7.0"
description = "Software Development Project Management Tool"
authors = [{ name = "Christian Assing", email = "chris@ca-net.org" }]
license = { text = "MIT License" }
readme = "README.md"
classifiers = [
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "appdirs>=1.4.4",
    "click>=8.1.7",
    "clientele>=1.8.1",
    "diskcache>=5.6.3",
    "fuzzyfinder>=2.1.0",
    "iterfzf>=1.9.0.67.0",
    "natsort>=8.4.0",
    "prompt-toolkit>=3.0.47",
    "pybreaker>=1.4.1",
    "pydantic-settings>=2.4.0",
    "pydantic>=2.8.2",
    "pyyaml>=6.0.2",
    "rich>=13.7.1",
    "textual>=1.0",
    "watchfiles>=1.0",
]
requires-python = ">= 3.14"

[project.urls]
homepage = "https://github.com/chassing/pyworkon"
respository = "https://github.com/chassing/pyworkon"
issues = "https://github.com/chassing/pyworkon/issues"

[project.scripts]
pyworkon = 'pyworkon.__main__:run'

[dependency-groups]
dev = [
    # development dependencies
    "mypy",
    "pytest-asyncio",
    "pytest-cov",
    "pytest",
    "ruff",
    "types-pyyaml",
    "types-requests",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyworkon"]

[tool.mypy]
files = ["pyworkon"]
plugins = ["pydantic.mypy", "clientele.mypy"]
enable_error_code = "truthy-bool, redundant-expr"
no_implicit_optional = true
check_untyped_defs = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "appdirs.*",
    "diskcache.*",
    "fuzzyfinder.*",
    "iterfzf.*",
    "pygments.token",
    "pydantic_settings.*",
    "textual.*",
]
ignore_missing_imports = true

[tool.ruff]
src = ["pyworkon"]
line-length = 88
target-version = 'py312'
fix = true

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "any-type",
    "unused-function-argument",                # Unused argument
    "unused-method-argument",                  # Unused argument
    "CPY",                                     # Missing copyright header
    "D10",                                     # Missing docstring in XXX
    "incorrect-blank-line-before-class",       # 1 blank line required before class docstring
    "blank-line-before-class",                 # No blank lines allowed before class docstring
    "multi-line-summary-first-line",           # multi-line-summary-first-line
    "multi-line-summary-second-line",          # multi-line-summary-second-line
    "D4",                                      # Doc string style
    "line-too-long",                           # Line too long
    "EM",                                      # error message in exceptions
    "logging-f-string",                        # Logging statement uses string formatting
    "PD",                                      # no pandas please
    "import-outside-top-level",                # `import` should be at the top-level of a file
    "too-many-public-methods",                 # Too many public methods
    "too-many-arguments",                      # Too many arguments
    "too-many-positional-arguments",           # Too many positional arguments
    "no-self-use",                             # no self-ussage
    "non-empty-init-module",                   # `__init__` module should only contain docstrings and re-exports
    "assert",                                  # Use of assert detected. Pytest uses assert
    "suspicious-subprocess-import",            # subprocess import
    "subprocess-popen-with-shell-equals-true", # subprocess check
    "subprocess-without-shell-equals-true",    # subprocess check for execution of untrusted input
    "raise-vanilla-args",                      # Avoid specifying long messages outside the exception class
    "try-consider-else",                       # try-consider-else
    # pydoclint
    "DOC",
    # May conflict with the formatter, https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "tab-indentation",
    "indentation-with-invalid-multiple",
    "indentation-with-invalid-multiple-comment",
    "over-indented",
    "docstring-tab-indentation",
    "triple-single-quotes",
    "Q",
    "missing-trailing-comma",
    "prohibited-trailing-comma",
    "single-line-implicit-string-concatenation",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "private-member-access",                 # private member access — needed to test internal state
    "subprocess-without-shell-equals-true",  # subprocess partial path — git commands in test fixtures
    "start-process-with-partial-path",       # partial executable path — git commands in test fixtures
    "magic-value-comparison",                # magic value comparison — test assertions
    "boolean-type-hint-positional-argument", # boolean positional arg — parametrize values
    "compare-to-empty-string",               # compare to empty string — test assertions
    "typing-only-standard-library-import",   # typing-only stdlib import — test fixtures use Path at runtime
    "run-process-in-async-function",         # subprocess in async — test helpers use sync git commands
    "create-subprocess-in-async-function",   # blocking process in async — same
    "too-many-arguments",                    # too many arguments — test factory functions
    "unused-variable",                       # unused variable — unpacked tuple results
    "import-private-name",                   # private name import — testing internal filter functions
]
"pyworkon/daemon/providers/gitlab/consumer.py" = ["unused-async"]
"pyworkon/interfaces/shell/commands/*.py" = ["start-process-with-partial-path"]


[tool.ruff.format]
preview = true


[tool.ruff.lint.isort]
known-first-party = ["pyworkon"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]
