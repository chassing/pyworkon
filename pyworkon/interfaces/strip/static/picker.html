<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "pyworkon-icons";
    src: url(data:font/woff2;base64,__PYWORKON_FONT_BASE64__) format("woff2");
    font-display: swap;
  }
  :root {
    --card: #20252afc;
    --border: #ffffff1d;
    --line: #ffffff12;
    --text: #e9ebef;
    --dim: #929ba9;
    --accent: #e0af68;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: transparent;
    overflow: hidden;
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--text);
  }
  .icon {
    display: inline-flex;
    justify-content: center;
    width: 1.3em;
    flex: none;
  }
  .nf {
    font-family: "pyworkon-icons", sans-serif;
    font-weight: normal;
    font-style: normal;
    line-height: 1;
  }
  #card {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 13px;
    box-shadow: 0 22px 60px #0008, 0 2px 8px #0004;
    overflow: hidden;
  }
  #search-row {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    flex: none;
  }
  #search-row .icon { color: #818c9a; font-size: 14px; }
  #filter {
    flex: 1;
    min-width: 0;
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font: inherit;
    font-size: 14px;
    caret-color: var(--accent);
  }
  #filter::placeholder { color: #6c7683; }
  #count { font-size: 11px; color: #6c7683; flex: none; }
  #list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 6px;
  }
  .empty {
    padding: 20px 10px;
    text-align: center;
    color: #76828f;
    font-size: 12px;
  }
  .project {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 8px 9px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    text-align: left;
    color: inherit;
    cursor: pointer;
  }
  .project.--active {
    background: #ffffff0f;
    box-shadow: inset 0 0 0 1px #b7c6db30;
  }
  .provider {
    width: 24px;
    height: 24px;
    flex: none;
    color: #8d9aa7;
    font-size: 19px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* Real provider brand colors, not a single neutral gray for both --
     GitHub's mark reads fine as a light neutral, GitLab's is its own
     brand orange. */
  .provider.github { color: #c7cdd3; }
  .provider.gitlab { color: #e0714a; }
  .project-copy { flex: 1; min-width: 0; }
  .project-name {
    display: block;
    font-size: 13px;
    font-weight: 550;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  mark { background: none; color: var(--accent); font-weight: 650; }
  .project-owner {
    display: block;
    font-size: 11px;
    color: #7f8c98;
    margin-top: 2px;
  }
  #footer {
    display: flex;
    justify-content: space-between;
    padding: 8px 13px;
    border-top: 1px solid var(--line);
    font-size: 10.5px;
    color: #717c89;
    flex: none;
  }
  kbd {
    font: inherit;
    background: #ffffff0c;
    border-radius: 4px;
    padding: 1px 5px;
    margin: 0 1px;
    color: #aab4c0;
  }
</style>
</head>
<body>
<div id="card">
  <div id="search-row">
    <span class="icon">⌕</span>
    <input id="filter" type="text" placeholder="Filter projects…" autocomplete="off" spellcheck="false" />
    <span id="count"></span>
  </div>
  <div id="list"></div>
  <div id="footer">
    <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
    <span><kbd>↵</kbd> open</span>
    <span><kbd>esc</kbd> cancel</span>
  </div>
</div>

<script>
// Injected server-side from pyworkon/interfaces/tui/icons.py -- see
// pyworkon/interfaces/relay/icons.py and app.py's `_render_picker_html()`.
const ICONS = /*__PYWORKON_ICONS__*/;
const NF_KEYS = new Set(["github", "gitlab"]);
// Display names for the second line's "Provider · owner" text -- a raw
// provider_type value ("github"/"gitlab") would otherwise read as
// lowercase/internal next to a real owner name.
const PROVIDER_LABELS = {github: "GitHub", gitlab: "GitLab"};

function iconClass(key, extra) {
  const parts = ["icon"];
  if (NF_KEYS.has(key)) parts.push("nf");
  if (extra) parts.push(extra);
  return parts.join(" ");
}

// Same escaping behavior as strip.html's own helper -- safe for both
// text-node content and double- or single-quoted attribute values.
function escapeHtml(value) {
  const div = document.createElement("div");
  div.textContent = value ?? "";
  return div.innerHTML.replaceAll('"', "&quot;").replaceAll("'", "&#39;");
}

// "github/owner/repo" -> "owner/repo" -- same convention as strip.html's
// `ownerRepoFromProjectId()`, duplicated here since this is a separate file.
function ownerFromProjectId(projectId) {
  const parts = projectId.split("/");
  return parts.length > 2 ? parts.slice(1, -1).join("/") : (parts[1] || "");
}

function highlight(text, term) {
  const escaped = escapeHtml(text);
  if (!term) return escaped;
  const idx = text.toLowerCase().indexOf(term.toLowerCase());
  if (idx === -1) return escaped;
  return (
    escapeHtml(text.slice(0, idx)) +
    "<mark>" + escapeHtml(text.slice(idx, idx + term.length)) + "</mark>" +
    escapeHtml(text.slice(idx + term.length))
  );
}

let lastState = {sessions: [], plain_sessions: [], projects: []};
let currentMatches = [];
let activeIndex = 0;

const filterEl = document.getElementById("filter");
const listEl = document.getElementById("list");
const countEl = document.getElementById("count");

function render() {
  const projects = lastState.projects || [];
  const term = filterEl.value.trim().toLowerCase();
  currentMatches = projects.filter((p) => {
    if (!term) return true;
    const owner = ownerFromProjectId(p.project_id);
    return `${p.project_name} ${owner}`.toLowerCase().includes(term);
  });
  activeIndex = Math.max(0, Math.min(activeIndex, currentMatches.length - 1));
  countEl.textContent = term
    ? `${currentMatches.length} of ${projects.length}`
    : `${projects.length} project${projects.length === 1 ? "" : "s"}`;
  if (!currentMatches.length) {
    listEl.innerHTML = `<div class="empty">No matching projects.</div>`;
    return;
  }
  listEl.innerHTML = currentMatches
    .map((p, i) => {
      const owner = ownerFromProjectId(p.project_id);
      const icon = p.provider_type ? ICONS[p.provider_type] || "" : "";
      const providerLabel = p.provider_type ? PROVIDER_LABELS[p.provider_type] || p.provider_type : null;
      const ownerLine = providerLabel ? `${providerLabel} · ${escapeHtml(owner)}` : escapeHtml(owner);
      return `
        <div class="project${i === activeIndex ? " --active" : ""}" data-index="${i}">
          <span class="${iconClass(p.provider_type, "provider")} ${escapeHtml(p.provider_type || "")}">${icon}</span>
          <span class="project-copy">
            <span class="project-name">${highlight(p.project_name, term)}</span>
            <span class="project-owner">${ownerLine}</span>
          </span>
        </div>
      `;
    })
    .join("");
}

function openProject(project) {
  if (!project) return;
  pywebview.api.enter_project(project.project_id);
}

filterEl.addEventListener("input", () => {
  activeIndex = 0;
  render();
});

listEl.addEventListener("click", (ev) => {
  const row = ev.target.closest(".project");
  if (row) openProject(currentMatches[Number(row.dataset.index)]);
});

document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape") {
    ev.preventDefault();
    pywebview.api.close_project_picker();
  } else if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
    ev.preventDefault();
    activeIndex = Math.max(
      0,
      Math.min(currentMatches.length - 1, activeIndex + (ev.key === "ArrowDown" ? 1 : -1))
    );
    render();
    listEl.querySelector(".project.--active")?.scrollIntoView({block: "nearest"});
  } else if (ev.key === "Enter") {
    ev.preventDefault();
    openProject(currentMatches[activeIndex]);
  }
});

// Called by `bridge.py`'s `open_project_picker()` right after the native
// window is shown -- making the *window* key doesn't put the page's own
// focus on any particular element, and any filter text from the last time
// this was open would otherwise still be sitting there.
window.__onPickerShown = function () {
  filterEl.value = "";
  activeIndex = 0;
  render();
  filterEl.focus({preventScroll: true});
};

function updateState(payload) {
  lastState = payload;
  render();
}
</script>
</body>
</html>
