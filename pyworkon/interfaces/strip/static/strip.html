<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "pyworkon-icons";
    src: url(data:font/woff2;base64,__PYWORKON_FONT_BASE64__) format("woff2");
    font-display: swap;
  }
  :root {
    --strip-radius: 16px;
    --bg: #1b1f22eb;
    --card: #20252afc;
    --border: #ffffff1d;
    --line: #ffffff12;
    --chip-bg: #ffffff03;
    --chip-border: #ffffff09;
    --strip-border: #ffffff17;
    --text: #e9ebef;
    --dim: #929ba9;
    --green: #8cc9a5;
    --red: #f09a9e;
    --yellow: #e9bd75;
    --purple: #b18cf2;
    --accent: #e0af68;
    --cyan: #56c2e6;
    --magenta: #ff5fd7;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: transparent;
    overflow: hidden;
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--text);
    user-select: none;
  }
  .icon {
    display: inline-flex;
    justify-content: center;
    width: 1.3em;
    flex: none;
  }
  .nf {
    font-family: "pyworkon-icons", sans-serif;
    font-weight: normal;
    font-style: normal;
    line-height: 1;
  }
  [data-spin="true"] { font-size: 1.2em; }

  body { position: relative; }

  /* --- Collapsed handle --- */
  #handle {
    display: none;
    position: absolute;
    left: 50%;
    bottom: 2px;
    transform: translateX(-50%);
    width: 64px;
    height: 6px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.28);
    cursor: pointer;
  }
  body.collapsed #handle { display: block; }
  body.collapsed #strip { display: none; }

  /* --- Strip: pinned to the bottom edge, filling the native window's full
     height -- `100%`, not a fixed px value, since that height itself varies
     (56px full-width mode, or the real Dock's own height in beside-dock
     mode -- see dock_geometry.py's StripLayout). Safe to do now that the
     window only ever resizes between exactly this and `.collapsed`'s hidden
     state (`toggle_collapse()`) -- unlike the old single-window design,
     where the window also grew taller to make room for the hover popup and
     `#strip` needed to stay fixed-height to leave that space empty above it. --- */
  #strip {
    position: absolute;
    left: 0;
    right: 0;
    /* A few px of transparent breathing room below the bar itself -- the
       real macOS Dock's icons float a visible gap above the screen's bottom
       edge even when not auto-hidden, but our visible chip bar (unlike the
       Dock's bare icons) has its own solid background/border filling its
       whole native window, so without this it reads as flush against the
       screen edge while the Dock next to it visibly isn't. Purely cosmetic:
       the native window itself (and therefore click/hover rects) is
       unaffected, since this only shrinks the *visible* box within it. */
    bottom: 2px;
    height: calc(100% - 2px);
    display: flex;
    flex-direction: row;
    /* A chip's own natural (un-stretched) height is usually well under the
       strip's -- in `full_width` mode that's a fixed 56px, but `beside_dock`
       mode matches the real Dock's own height (dock_geometry.py), which can
       be noticeably taller -- so `center` leaves leftover space split above
       and below each chip, same as the real Dock does with its own icons.
       An earlier attempt switched this to `flex-start` specifically to close
       a visible gap between the hover popup and the chip row -- wrong fix:
       it closed the gap by making chips hug the top instead, which looked
       off-center. The real fix is in `hover_monitor.py`'s
       `_popup_screen_position()`, which now anchors the popup to the
       *hovered chip's own* top edge rather than the strip window's, so it
       sits flush against the chip regardless of how the chip is aligned
       within the (possibly taller) strip. */
    align-items: center;
    gap: 7px;
    padding: 0 12px;
    background: var(--bg);
    border: 1px solid var(--strip-border);
    border-radius: var(--strip-radius);
    box-shadow: 0 12px 40px #0005, inset 0 1px #ffffff03;
  }
  /* The scrollable chip area, nested inside `#strip` -- separate from it so
     the "open a new session" toggle button (a sibling, not a scrollable
     chip) always stays visible at the strip's right edge instead of
     scrolling away with the chips. */
  #chip-row {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 7px;
    overflow-x: auto;
    overflow-y: hidden;
    white-space: nowrap;
  }
  /* Separates the toggle button from the scrollable chip row -- without it,
     the button reads as just one more chip instead of a distinct, permanent
     action at the strip's edge. */
  .add-divider {
    height: 26px;
    width: 1px;
    background: var(--line);
    flex: none;
    margin: 0 1px;
  }
  .add-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    flex: none;
    border: 1px solid var(--chip-border);
    border-radius: 10px;
    background: #ffffff04;
    color: #9aa4b1;
    cursor: pointer;
    font-size: 18px;
    font-weight: 400;
  }
  .add-toggle .icon { transition: transform 0.16s ease; }
  /* Deliberately no `:hover` rule here (unlike `.chip:hover` below) --
     confirmed via `getComputedStyle()` after a real close that this button's
     `:hover` state gets permanently stuck showing `.--open`'s own identical
     warm color: this window never becomes key/active (see native.py's
     `prepare_window()`), so the `mouseleave` that would normally clear
     `:hover` never reliably reaches it once the app backgrounds itself again
     (reactivating whatever app the picker handed focus back to) -- the exact
     same "background window doesn't get real hover events" limitation
     `hover_monitor.py` exists to work around for the session popup, just
     never noticed here before since a stuck hover looked identical to the
     (correct) `.--open` state. The button's only visual state that matters
     is `--open` (driven explicitly from Python, never a native pseudo-class),
     so it doesn't need its own separate, unreliable hover affordance. */
  .add-toggle.--open {
    background: #e0af6818;
    border-color: #e0af6870;
    color: #edc58e;
  }
  .add-toggle.--open .icon { transform: rotate(45deg); }
  #empty {
    color: var(--dim);
    padding: 0 4px;
  }
  .chip {
    position: relative;
    display: inline-flex;
    flex-direction: row;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    /* Fixed regardless of content -- a plain-session chip only ever has one
       line of text (no branch row), which would otherwise render visibly
       shorter than every other chip. Tuned to match a two-line chip's
       natural height (name + branch, with the gap between them). */
    min-height: 56px;
    border-radius: 9px;
    background: var(--chip-bg);
    border: 1px solid var(--chip-border);
    cursor: pointer;
    min-width: 110px;
    max-width: 260px;
    flex: none;
  }
  .chip:hover { background: #ffffff09; border-color: #b7c6db45; }
  .chip.--pending { background: #d6ac6410; border-color: #e9bd7525; }
  .chip.--attention { background: #d17c8110; border-color: #f09a9e35; }
  /* A blocked agent is the one "attention" case that gets a blink on top of
     the shared tint -- a PR failure alone doesn't blink, since it's not
     time-sensitive the way a blocked agent is. Pulses background/border color
     (not the chip's overall opacity), so text/icons stay fully legible. */
  @keyframes chip-agent-waiting-blink {
    0%, 100% { background-color: #d17c8118; border-color: #f09a9e65; }
    50% { background-color: #d17c8145; border-color: #f09a9e95; }
  }
  .chip.--agent-waiting {
    box-shadow: inset 0 1px #ffffff05;
    animation: chip-agent-waiting-blink 3s ease-in-out infinite;
  }
  .chip.--plain { opacity: 0.85; }

  /* One small dot in the chip's corner marks the one state that's actually
     time-sensitive (an agent blocked on input) -- distinct from the shared
     "attention" background tint a PR failure alone also gets. */
  .attention-dot {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 8px #f09a9e30;
  }
  .chip-main {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
    min-width: 0;
    flex: 1;
  }
  .chip-name {
    font-weight: 600;
    font-size: 15px;
    letter-spacing: -0.1px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chip.--plain .chip-name { color: #a5adb7; }
  .chip-sub {
    font-size: 13px;
    color: #919ba6;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    overflow: hidden;
  }
  .chip-sub .branch { overflow: hidden; text-overflow: ellipsis; }
  .badge {
    font-size: 10.5px;
    padding: 1px 6px;
    border-radius: 8px;
    flex: none;
  }
  .badge.--draft { background: rgba(255, 255, 255, 0.08); color: var(--dim); }
  .badge.--merged { background: #b18cf222; color: var(--purple); }

  /* Chip status icon: ONE combined indicator per chip for both AI agent
     status and PR/MR CI check status -- a dedicated column spanning the
     chip's full height, right-aligned. Rendered at all only for the three
     non-trivial states (busy/waiting/failed); nothing shown otherwise. */
  .chip-status {
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
    width: 26px;
    font-size: 24px;
  }
  .chip-status.status-busy { color: var(--yellow); }
  .chip-status.status-waiting { color: var(--red); }
  .chip-status.status-failed { color: var(--red); }
  .chip-status.status-idle { color: #788492; font-size: 16px; }

  /* --- Hover popup (full detail) --- */
  #popup {
    position: absolute;
    bottom: 56px;
    display: none;
    min-width: 280px;
    max-width: 360px;
    max-height: 300px;
    overflow-y: auto;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 17px 19px 13px;
    box-shadow: 0 18px 50px #0006, 0 2px 8px #0004;
    z-index: 1000;
    user-select: text;
  }
  #popup.--visible { display: block; }
  #popup > * + * { margin-top: 0.5rem; }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    padding: 0.15rem 0;
  }
  .row-left {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    overflow: hidden;
    min-width: 0;
    flex: 1;
  }
  .header .name {
    font-weight: 620;
    font-size: 16px;
    letter-spacing: -0.2px;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .header-icons { display: flex; align-items: center; gap: 10px; flex: none; color: #818c9a; }
  .provider-icon { color: #818c9a; }
  .repo-link { color: #818c9a; }
  .repo-link:hover { color: var(--accent); }
  .dim { color: var(--dim); }
  .branch-icon { color: #859aab; }
  .section-label {
    font-size: 12px;
    line-height: 1.4;
    font-weight: 650;
    color: #83909e;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  /* `min-width: 0` overrides the flex item default of `min-width: auto`,
     which otherwise means "never shrink below this content's unwrapped
     width" -- for a long, hyphen-heavy identifier (a branch/check name with
     no spaces) that default refuses to shrink at all, overflowing straight
     past the popup's own edge (clipped with no visual indication, since
     `html`/`body` have `overflow: hidden`) instead of wrapping onto another
     line the way shorter text naturally does. `overflow-wrap: anywhere` is
     a defensive fallback for the rare case where even a single "word" (no
     hyphen/space break opportunity at all) is still too long on its own. */
  .branch-name { color: #b7c1ce; min-width: 0; overflow-wrap: anywhere; line-height: 1.65; }
  .dirty-icon { color: var(--yellow); }
  /* No divider above Branch -- it directly follows the header. PR/Checks
     below it each get their own `.section` divider instead. */
  .branch-block { padding-top: 0; border-top: none; }
  .branch-block .section-label { margin-bottom: 6px; }
  /* Shared section-divider look for Pull Request / Checks -- deliberately
     sets only `border-top`/`padding-top`, never `margin-top`: the inter-block
     gap itself comes from `#popup > * + * { margin-top: 0.5rem; }` above,
     whose `#popup`-rooted selector outranks a plain `.section` margin-top
     would, which would otherwise silently lose that fight. */
  .section { border-top: 1px solid var(--line); padding-top: 14px; }
  .section-heading { display: flex; justify-content: space-between; align-items: center; }
  .pr-link { color: #b0c5e8; font-size: 14px; }
  .pr-link .icon { font-size: 13px; }
  .pr-title { overflow-wrap: anywhere; min-width: 0; color: #e1e5eb; font-size: 16px; line-height: 1.6; margin: 8px 0 9px; }
  .pr-title.draft { opacity: 0.6; }
  .review { font-size: 13px; color: #9ca8b5; display: flex; align-items: center; gap: 6px; }
  .separator { margin: 0 3px; color: #66717e; }
  /* Covers every clickable link in the popup: PR link, review-request links,
     and any CI check row with a url, regardless of its status. */
  [data-url] { cursor: pointer; }
  .link-accent { color: var(--accent); text-decoration: underline; }
  /* Small context text to the right of a section label -- the CI provider
     name next to "Checks" ("Red Hat Konflux"), the agent count next to "AI". */
  .section-context { font-size: 13px; color: #7e8b98; }
  .check-overview { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: #788694; }
  .check-count-failure { color: var(--red); }
  .check-count-pending { color: var(--yellow); }
  .check-count-passed { color: var(--green); background: #8cc9a511; padding: 2px 7px; border-radius: 5px; }
  .check-sep { color: #66717e; }
  .check-rows { margin-top: 6px; }
  .check-row { display: flex; align-items: center; gap: 8px; min-height: 28px; padding: 5px 0; border-top: 1px solid #ffffff06; font-size: 13px; }
  .check-row:first-child { border-top: 0; }
  .check-icon { color: var(--red); flex: none; }
  .check-icon.icon { font-size: 0.85em; }
  .check-icon.success { color: var(--green); }
  .check-name { flex: 1; min-width: 0; color: #b6c1cc; line-height: 1.45; overflow-wrap: anywhere; }
  .check-state { font-size: 12px; color: #bc8b93; white-space: nowrap; flex: none; }
  .check-state.pending { color: #b8a27b; }
  .check-state.success { color: var(--green); }
  .check-external { color: #687583; flex: none; font-size: 0.85em; }
  details { margin-top: 9px; }
  summary { display: flex; align-items: center; gap: 7px; cursor: pointer; list-style: none; font-size: 13px; color: #8f9ca9; padding: 4px 0; }
  summary::-webkit-details-marker { display: none; }
  .chevron { color: #6e7b89; font-size: 14px; margin-left: auto; transition: transform 0.15s ease; }
  details[open] .chevron { transform: rotate(90deg); }
  /* No `max-height`/`overflow-y` of its own -- `#popup` is already the one
     scroll container for the whole card. A second nested scrollbar here
     produced two visible scrollbars at once when expanded. */
  /* Review/PR-state badges -- same pill recipe as `.check-count-passed`
     (tinted background at the color's own hex + low alpha), so "Approved"/
     "Open pull request" read as the same kind of status badge as the CI
     checks overview ("4 running · 9 passed") right below them. */
  .review-badge { padding: 2px 7px; border-radius: 5px; }
  .review-badge.--approved, .review-badge.--open { color: var(--green); background: #8cc9a511; }
  .review-badge.--changes, .review-badge.--closed { color: var(--red); background: #f09a9e11; }
  .review-badge.--pending { color: var(--yellow); background: #e9bd7511; }
  .review-badge.--merged { color: var(--purple); background: #b18cf222; }
  .review-badge.--draft { color: var(--dim); background: rgba(255, 255, 255, 0.08); }
  .reviews-block { padding-top: 0.3rem; border-top: 1px solid var(--border); }
  .review-header-icon { color: var(--yellow); }
  .review-title { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .agent-icon { color: var(--magenta); }
  .agent-name { color: var(--dim); }
  .agent-row-working { color: var(--yellow); }
  .agent-row-idle { color: #788492; }
  .agent-row-waiting { color: var(--red); }
  /* Only the row that actually needs the user's attention gets a tint --
     working/idle rows stay quiet, the same "reserve color for what matters"
     rule the chips themselves follow. Negative horizontal margin keeps the
     row's own text flush with its siblings despite the added padding. */
  .agent-row--waiting {
    background: #d17c8110;
    border-radius: 6px;
    margin: 0 -6px;
    padding: 0.15rem 6px;
  }
  .agent-row-status { display: flex; align-items: center; gap: 5px; font-size: 13px; white-space: nowrap; }
  /* The Nerd Font glyphs (question-circle, moon) read noticeably smaller
     than their bounding box suggests at plain text size -- bumped up on
     their own, independent of the status text next to them. */
  .agent-row-status-icon { font-size: 18px; }
  .popup-footer {
    padding-top: 11px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #7e8b98;
    font-size: 12px;
  }

  /* --- Popup window mode: the hover-detail popup is a separate, fixed-size
     native window (see native.py's `prepare_popup_window()`), not part of
     the strip's own resizable frame -- this same html/CSS/JS is shared by
     both windows, gated by the `__PYWORKON_IS_POPUP__`-derived
     `body.popup-window` class set near the top of the script below. Only
     `#popup` is ever shown in this mode; it fills the entire (separate)
     window instead of being absolutely positioned above the strip. --- */
  body.popup-window #strip,
  body.popup-window #handle {
    display: none !important;
  }
  /* `height: 100%`, not `auto` -- the window is *always* already sized
     (`hover_monitor.py`'s `_process()`) to fit the content measured by
     `__showPopupFor()`, so forcing the card to actually fill that window
     guarantees it never leaves a visible gap below itself, regardless of any
     subtle mismatch between the measured size and the final rendered one
     (confirmed via `CGWindowListCopyWindowInfo` that the *native* windows
     really were pixel-flush with zero gap between them -- the gap some
     popups showed was entirely inside this element, between its own
     bottom edge and the window's). `__showPopupFor()` temporarily forces
     `height: auto` back via inline style purely for its own measurement (see
     below) -- *that* must stay content-driven, not window-size-driven, or
     `scrollHeight` would be at least the window's current (possibly stale,
     already-large) size regardless of actual content, a self-reinforcing
     ratchet where one tall popup makes every later one measure as tall too.
     `max-height: 100vh` still matters for that same measurement step's
     fallback: `updateState()`'s live popup refresh (see below) deliberately
     updates content without resizing the native window (to avoid a WKWebView
     relayout flash on an already-visible window), so content can grow taller
     than whatever height the window happened to be shown at -- `100vh`
     always matches the real window, so the overflow becomes reachable via
     this element's own `overflow-y: auto` instead of a fixed px value
     silently rendering past the real viewport. */
  body.popup-window #popup {
    display: block !important;
    position: static;
    bottom: auto;
    min-width: 0;
    max-width: none;
    width: 100%;
    height: 100%;
    max-height: 100vh;
    box-shadow: none;
  }

</style>
</head>
<body>
<div id="handle" title="Show pyworkon strip"></div>
<div id="strip">
  <div id="chip-row"></div>
  <div class="add-divider"></div>
  <div id="add-toggle" class="add-toggle" title="Open a new session"><span class="icon">+</span></div>
</div>
<div id="popup"></div>

<script>
// This same page is loaded by both the strip window and its separate
// hover-popup window (see native.py's `prepare_popup_window()` for why the
// popup is a whole separate window rather than part of the strip's own
// resizable frame). `__PYWORKON_IS_POPUP__` is substituted server-side by
// `app.py`'s `_render_strip_html(is_popup=...)`.
const IS_POPUP_WINDOW = __PYWORKON_IS_POPUP__;
if (IS_POPUP_WINDOW) document.body.classList.add("popup-window");

// "__PYWORKON_STRIP_MODE__" is substituted server-side by `app.py`'s
// `_render_strip_html(mode=...)` -- see `dock_geometry.StripLayout.mode`.
// Sets `body.beside-dock`, currently unused by any CSS rule (full chip
// detail renders the same in both modes -- a dedicated compact-chip style
// was tried and reverted after looking too sparse in practice) but kept as
// a hook for the strip/popup windows to key future mode-dependent styling
// off, since `bridge.update_layout()` already pushes mode changes here live.
const STRIP_MODE = "__PYWORKON_STRIP_MODE__";
window.setStripMode = function (mode) {
  document.body.classList.toggle("beside-dock", mode === "beside_dock");
};
window.setStripMode(STRIP_MODE);

// Injected server-side from native.py's `POPUP_MIN_WIDTH`/`POPUP_MAX_WIDTH`
// -- see `__showPopupFor()` below for why the popup window's own width
// measurement needs to match Python's `clamp_popup_width()` bounds exactly,
// not just a separately hardcoded (and easy to drift out of sync) copy.
const POPUP_MIN_WIDTH = Number("__PYWORKON_POPUP_MIN_WIDTH__");
const POPUP_MAX_WIDTH = Number("__PYWORKON_POPUP_MAX_WIDTH__");
// `width: max-content`'s own reported `scrollWidth` doesn't reliably
// round-trip: re-applying that *exact* integer as a plain pixel `width` can
// still wrap a deeply-nested line (confirmed empirically in isolation --
// `#popup > .checks-block > .check-rows > .check-row > .check-name` wrapped at
// `scrollWidth`'s own reported value, and needed +4px, not +0, to stop;
// WebKit's intrinsic-sizing pass and its real layout pass disagree by a
// couple of sub-pixel-rounding steps once nested this many flex levels deep).
// A small fixed buffer -- not content-dependent, so it doesn't reintroduce
// the "arbitrary fixed cap" problem this file's width/height measurement has
// already moved away from -- absorbs that rounding gap with room to spare.
const POPUP_WIDTH_ROUNDING_SAFETY_MARGIN = 8;

// Injected server-side from pyworkon/interfaces/tui/icons.py -- see
// pyworkon/interfaces/relay/icons.py and app.py's `_render_strip_html()`. Do
// not hardcode icon glyphs here; add a new key to relay/icons.py instead.
const ICONS = /*__PYWORKON_ICONS__*/;

const NF_KEYS = new Set([
  "branch", "pr", "agent", "github", "gitlab", "agentIdle", "agentWaiting",
  "reviewRequest", "dirty", "ciPending",
]);

function iconClass(key, extra) {
  const parts = ["icon"];
  if (NF_KEYS.has(key)) parts.push("nf");
  if (extra) parts.push(extra);
  return parts.join(" ");
}

const ICON_SPACER = `<span class="icon"></span>`;

// Safe for both text-node content *and* double- or single-quoted attribute
// values. `textContent` -> `innerHTML` alone escapes `&`/`<`/`>` but not
// quote characters (they're only special inside an attribute, not in text
// node content, so the serializer has no reason to escape them) -- used
// inside e.g. `data-session="${escapeHtml(name)}"`, an unescaped `"` in
// `name` would terminate the attribute early and corrupt the element's
// other attributes, breaking `el.dataset.session` lookups. `&quot;`/`&#39;`
// decode back to literal quote characters in *any* context, so escaping
// them unconditionally here is always safe, not just where currently needed.
function escapeHtml(value) {
  const div = document.createElement("div");
  div.textContent = value ?? "";
  return div.innerHTML.replaceAll('"', "&quot;").replaceAll("'", "&#39;");
}

function ownerRepoFromProjectId(projectId) {
  const parts = projectId.split("/");
  return parts.length > 1 ? parts.slice(1).join("/") : projectId;
}

const SPIN_FRAMES = ["⠋", "⠙", "⠹", "⠸", "⠼", "⠴", "⠦", "⠧", "⠇", "⠏"];
let spinFrame = 0;
function tickSpinners() {
  spinFrame = (spinFrame + 1) % SPIN_FRAMES.length;
  document.querySelectorAll('[data-spin="true"]').forEach((el) => {
    el.textContent = SPIN_FRAMES[spinFrame];
  });
}
setInterval(tickSpinners, 80);

// ---- Chip badges (compact, only the most important status) ----

function hasFailedCheck(pr) {
  return (pr.ci_checks || []).some((c) => c.status === "failure");
}

// Combines PR CI status *and* agent status into one attention level, since
// either one needing the user's eyes should make the chip stand out the
// same way: a failed PR check and an agent waiting on input are equally
// "come look at this" signals.
function chipAttentionLevel(session) {
  const pr = session.pr;
  const agents = session.agents || [];
  const prFailed = pr && hasFailedCheck(pr);
  const agentWaiting = agents.some((a) => a.status === "waiting");
  if (prFailed || agentWaiting) return "attention";
  const prPending = pr && !pr.is_draft && pr.status === "pending";
  const agentWorking = agents.some((a) => a.status === "working");
  if (prPending || agentWorking) return "pending";
  return "ok";
}

// An agent waiting on input gets a blink on top of the shared "attention"
// red background (see the `.chip.--agent-waiting` CSS above) -- a PR
// failure alone doesn't blink, only a blocked agent asking a question does.
function chipIsAgentWaiting(session) {
  const agents = session.agents || [];
  return agents.some((a) => a.status === "waiting");
}

function renderPrBadge(pr) {
  if (!pr) return "";
  if (pr.is_draft) return `<span class="badge --draft">Draft</span>`;
  return "";
}

// ONE combined status icon per chip, covering both AI agent status and
// PR/MR CI check status -- never two separate spinners. Priority (highest
// first), exactly:
//   agent waiting              -> "?" (agentWaiting icon), regardless of CI
//   agent working OR CI pending -> spinner
//   CI failed                  -> "x" (ciFailure icon)
//   agent idle (none of above) -> dim idle icon
//   no agent and no CI info    -> nothing
function renderChipStatus(session) {
  const pr = session.pr;
  const agents = session.agents || [];
  const agentWaiting = agents.some((a) => a.status === "waiting");
  const agentWorking = agents.some((a) => a.status === "working");
  const agentIdle = agents.some((a) => a.status === "idle");
  const ciPending = pr && !pr.is_draft && pr.status === "pending";
  const ciFailed = pr && hasFailedCheck(pr);

  if (agentWaiting) {
    return `<div class="chip-status status-waiting"><span class="${iconClass("agentWaiting")}">${ICONS.agentWaiting}</span></div>`;
  }
  if (agentWorking || ciPending) {
    return `<div class="chip-status status-busy"><span data-spin="true">${SPIN_FRAMES[0]}</span></div>`;
  }
  if (ciFailed) {
    return `<div class="chip-status status-failed"><span class="${iconClass("ciFailure")}">${ICONS.ciFailure}</span></div>`;
  }
  if (agentIdle) {
    return `<div class="chip-status status-idle"><span class="${iconClass("agentIdle")}">${ICONS.agentIdle}</span></div>`;
  }
  return "";
}

function renderChip(session) {
  const status = chipAttentionLevel(session);
  const waiting = chipIsAgentWaiting(session);
  const waitingClass = waiting ? " --agent-waiting" : "";
  return `
    <div class="chip --${status}${waitingClass}" data-session="${escapeHtml(session.session_name)}">
      <div class="chip-main">
        <div class="chip-name">${escapeHtml(session.project_name)}</div>
        <div class="chip-sub">
          <span class="branch">${escapeHtml(session.branch || "")}</span>
          ${renderPrBadge(session.pr)}
        </div>
      </div>
      ${renderChipStatus(session)}
      ${waiting ? `<span class="attention-dot"></span>` : ""}
    </div>
  `;
}

function renderPlainChip(name) {
  return `
    <div class="chip --plain" data-session="${escapeHtml(name)}">
      <div class="chip-main">
        <div class="chip-name">${escapeHtml(name)}</div>
      </div>
    </div>
  `;
}

// ---- Hover popup (full detail, same rendering as the relay dashboard) ----

function renderBranch(session) {
  if (!session.branch) return "";
  return `
    <div class="branch-block">
      <div class="section-label">Branch</div>
      <div class="row">
        <span class="row-left"><span class="${iconClass("branch", "branch-icon")}">${ICONS.branch}</span><span class="branch-name">${escapeHtml(session.branch)}</span></span>
        <span class="${iconClass("dirty", "dirty-icon")}">${session.is_dirty ? ICONS.dirty : ""}</span>
      </div>
    </div>
  `;
}

const REVIEW_BADGE = {
  approved: {cls: "--approved", text: "Approved"},
  changes_requested: {cls: "--changes", text: "Changes requested"},
  pending: {cls: "--pending", text: "Review pending"},
};
const STATE_BADGE = {
  open: {cls: "--open", text: "Open pull request"},
  closed: {cls: "--closed", text: "Closed pull request"},
};

// Review status and PR state render as the same kind of pill badge as the
// CI checks overview ("4 running · 9 passed") -- see `.review-badge` --
// rather than a plain icon+text sentence, so the two sections read
// consistently at a glance.
function renderReviewLine(pr) {
  if (pr.is_draft) {
    return `<div class="review"><span class="review-badge --draft">Draft pull request</span></div>`;
  }
  const review = REVIEW_BADGE[pr.review_status];
  const reviewPart = review
    ? `<span class="review-badge ${review.cls}">${review.text}</span>`
    : "";
  const state = pr.state === "merged" ? {cls: "--merged", text: "Merged"} : STATE_BADGE[pr.state] || STATE_BADGE.open;
  const statePart = `<span class="review-badge ${state.cls}">${state.text}</span>`;
  const sep = reviewPart ? `<span class="separator">·</span>` : "";
  return `<div class="review">${reviewPart}${sep}${statePart}</div>`;
}

function renderPrLink(pr, ownerRepo) {
  const linkText = `${ownerRepo}#${pr.number}`;
  const arrow = `<span class="${iconClass("externalLink")}">${ICONS.externalLink}</span>`;
  return pr.url
    ? `<span class="pr-link" data-url="${escapeHtml(pr.url)}">${linkText} ${arrow}</span>`
    : `<span class="pr-link">${linkText}</span>`;
}

function renderPr(pr, ownerRepo) {
  if (!pr) return "";
  const titleClass = pr.is_draft ? "pr-title draft" : "pr-title";
  const title = (pr.is_draft ? "[Draft] " : "") + escapeHtml(pr.title);
  return `
    <div class="section pr-block">
      <div class="section-heading">
        <div class="section-label">Pull request</div>
        ${renderPrLink(pr, ownerRepo)}
      </div>
      <div class="${titleClass}">${title}</div>
      ${renderReviewLine(pr)}
    </div>
  `;
}

// ---- CI checks: failed/pending shown immediately, successful checks
// collapsed behind a <details> summary so a long all-green list never
// crowds out the one or two checks that actually need attention. ----

function groupChecks(checks) {
  const groups = {failure: [], pending: [], success: []};
  (checks || []).forEach((c) => {
    (c.status === "failure" ? groups.failure : c.status === "pending" ? groups.pending : groups.success).push(c);
  });
  return groups;
}

// When every check name shares a literal "<prefix> / <suffix>" structure
// (common for CI systems that namespace checks under one pipeline name),
// show that shared prefix once next to the section label instead of
// repeating it in every single check name below.
function commonCheckPrefix(checks) {
  if (!checks || checks.length < 2) return null;
  let prefix = checks[0].name;
  for (let i = 1; i < checks.length; i++) {
    while (!checks[i].name.startsWith(prefix)) {
      prefix = prefix.slice(0, -1);
      if (!prefix) return null;
    }
  }
  const sepIdx = prefix.lastIndexOf(" / ");
  return sepIdx >= 3 ? prefix.slice(0, sepIdx) : null;
}

function stripCommonPrefix(name, prefix) {
  if (!prefix) return name;
  const full = `${prefix} / `;
  return name.startsWith(full) ? name.slice(full.length) : name;
}

function renderCheckRow(check, commonPrefix) {
  const displayName = stripCommonPrefix(check.name, commonPrefix);
  const isPending = check.status === "pending";
  const isSuccess = check.status === "success";
  const icon = isPending
    ? `<span class="check-icon" data-spin="true">${SPIN_FRAMES[0]}</span>`
    : isSuccess
    ? `<span class="${iconClass("ciSuccess", "check-icon success")}">${ICONS.ciSuccess}</span>`
    : `<span class="${iconClass("ciFailure", "check-icon")}">${ICONS.ciFailure}</span>`;
  const linkIcon = check.url
    ? `<span class="${iconClass("externalLink", "check-external")}">${ICONS.externalLink}</span>`
    : "";
  // `data-url` on the whole row, not just the name text -- the row's icon,
  // status label and padding all count as "the check", so clicking anywhere
  // on it (not just a narrow strip of text) should open the browser.
  const urlAttr = check.url ? ` data-url="${escapeHtml(check.url)}"` : "";
  const stateCls = isPending ? " pending" : isSuccess ? " success" : "";
  const stateText = isPending ? "Running" : isSuccess ? "Passed" : "Failed";
  return `
    <div class="check-row"${urlAttr}>
      ${icon}
      <span class="check-name">${escapeHtml(displayName)}</span>
      <span class="check-state${stateCls}">${stateText}</span>
      ${linkIcon}
    </div>
  `;
}

function renderCheckOverviewParts(groups) {
  const parts = [];
  if (groups.failure.length) parts.push(`<span class="check-count-failure">${groups.failure.length} failed</span>`);
  if (groups.pending.length) parts.push(`<span class="check-count-pending">${groups.pending.length} running</span>`);
  if (groups.success.length) parts.push(`<span class="check-count-passed">${groups.success.length} passed</span>`);
  return parts.join('<span class="check-sep">·</span>');
}

// The overview badges ("2 failed · 1 running · 12 passed") double as the
// `<details>` toggle itself, rather than a separate "N successful checks"
// row below them -- one clickable line instead of two. Defaults open
// whenever there's something that needs attention, so failed/pending checks
// are visible without the user having to click anything; defaults closed
// when everything passed, matching the original collapsed-by-default look.
function renderChecksSection(pr) {
  const checks = pr.ci_checks || [];
  if (checks.length === 0) return "";
  const groups = groupChecks(checks);
  const hasIssues = groups.failure.length > 0 || groups.pending.length > 0;
  const commonPrefix = commonCheckPrefix(checks);
  const contextLabel = commonPrefix ? `<span class="section-context">${escapeHtml(commonPrefix)}</span>` : "";
  const rows = [...groups.failure, ...groups.pending, ...groups.success]
    .map((c) => renderCheckRow(c, commonPrefix))
    .join("");
  return `
    <div class="section checks-block">
      <div class="section-heading"><div class="section-label">Checks</div>${contextLabel}</div>
      <details${hasIssues ? " open" : ""}>
        <summary class="check-overview">${renderCheckOverviewParts(groups)}<span class="chevron">›</span></summary>
        <div class="check-rows">${rows}</div>
      </details>
    </div>
  `;
}

function renderReviewRequests(reviewPrs) {
  if (!reviewPrs || reviewPrs.length === 0) return "";
  const items = reviewPrs.map((pr) => `
    <div class="row">
      <span class="row-left">${ICON_SPACER}<span class="review-title link-accent" data-url="${escapeHtml(pr.url)}">${escapeHtml(pr.title)} (#${pr.number})</span></span>
      <span class="dim">${escapeHtml(pr.author)}</span>
    </div>
  `).join("");
  return `
    <div class="reviews-block">
      <div class="row dim"><span class="row-left"><span class="${iconClass("reviewRequest", "review-header-icon")}">${ICONS.reviewRequest}</span><span>Reviews requested (${reviewPrs.length})</span></span></div>
      ${items}
    </div>
  `;
}

const AGENT_ROW_STATUS_CLASS = {
  working: "agent-row-working",
  idle: "agent-row-idle",
  waiting: "agent-row-waiting",
};
const AGENT_ROW_TEXT = {
  waiting: "Needs input",
  working: "Working",
  idle: "Idle",
};

function renderAgentStatusIcon(status) {
  if (status === "working") return `<span class="agent-row-status-icon" data-spin="true">${SPIN_FRAMES[0]}</span>`;
  if (status === "waiting") return `<span class="${iconClass("agentWaiting", "agent-row-status-icon")}">${ICONS.agentWaiting}</span>`;
  if (status === "idle") return `<span class="${iconClass("agentIdle", "agent-row-status-icon")}">${ICONS.agentIdle}</span>`;
  return "";
}

// Only the waiting row gets a tint -- working/idle stay visually quiet, the
// same "reserve color for what actually needs attention" rule the chips
// themselves follow.
function renderAgentRow(agent) {
  const rowCls = agent.status === "waiting" ? "row agent-row--waiting" : "row";
  const statusCls = AGENT_ROW_STATUS_CLASS[agent.status] || "";
  const statusText = AGENT_ROW_TEXT[agent.status] || agent.status;
  return `
    <div class="${rowCls}">
      <span class="row-left"><span class="${iconClass("agent", "agent-icon")}">${ICONS.agent}</span><span class="agent-name">${escapeHtml(agent.name)}</span></span>
      <span class="agent-row-status ${statusCls}">${renderAgentStatusIcon(agent.status)}${escapeHtml(statusText)}</span>
    </div>
  `;
}

// A dedicated section listing every agent by name and its own status,
// mirroring Branch/Pull Request/Checks: a section heading (label + agent
// count) followed by full per-agent detail. The count replaces a single
// section-wide status label, which can't describe mixed states (e.g. one
// agent working while another needs input) -- the strip's own chip status
// still shows just the single highest-priority state (waiting > working >
// idle); this section is where every agent gets its own say, and the
// highlighted waiting row (if any) communicates both who and what needs
// attention without a separate banner.
function renderAgentsSection(agents) {
  if (!agents || agents.length === 0) return "";
  const countLabel = `${agents.length} ${agents.length === 1 ? "agent" : "agents"}`;
  return `
    <div class="section agents-block">
      <div class="section-heading"><div class="section-label">AI</div><span class="section-context">${countLabel}</span></div>
      ${agents.map(renderAgentRow).join("")}
    </div>
  `;
}

function renderPopupFooter(ownerRepo) {
  return `<div class="popup-footer"><span>${escapeHtml(ownerRepo)}</span></div>`;
}

function renderPopupContent(session) {
  const providerIcon = ICONS[session.provider_type] || "";
  // Dedicated link icon next to the title, distinct from the provider icon
  // (a plain Unicode arrow, not a Nerd Font glyph -- the embedded webfont is
  // a hand-picked subset with no "link" glyph in it, see
  // static/fonts/NERD_FONTS_LICENSE.txt).
  const repoLink = session.repository_url
    ? `<span class="icon repo-link" data-url="${escapeHtml(session.repository_url)}" title="Open repository">${ICONS.externalLink}</span>`
    : "";
  const ownerRepo = ownerRepoFromProjectId(session.project_id);
  return `
    <div class="row header">
      <span class="name">${escapeHtml(session.project_name)}</span>
      <span class="header-icons">
        ${repoLink}
        <span class="${iconClass(session.provider_type, "provider-icon")}">${providerIcon}</span>
      </span>
    </div>
    ${renderBranch(session)}
    ${session.pr ? renderPr(session.pr, ownerRepo) : ""}
    ${session.pr ? renderChecksSection(session.pr) : ""}
    ${renderReviewRequests(session.review_prs)}
    ${renderAgentsSection(session.agents)}
    ${renderPopupFooter(ownerRepo)}
  `;
}

// ---- State + rendering ----

let lastState = {sessions: [], plain_sessions: []};
// Session the popup window is currently showing content for, if any -- the
// hover monitor only calls `__showPopupFor()` again when the *hovered chip*
// changes (see hover_monitor.py's `_poll_once()`), so a daemon-pushed state
// update while hovering the same chip the whole time would otherwise never
// reach the DOM until the user moves away and back. `updateState()` below
// uses this to refresh the open popup's content in place.
let shownPopupSession = null;

function findSession(name) {
  return lastState.sessions.find((s) => s.session_name === name) || null;
}

function renderStrip() {
  const container = document.getElementById("chip-row");
  const plain = lastState.plain_sessions.map(renderPlainChip).join("");
  const chips = lastState.sessions.map(renderChip).join("");
  if (!chips && !plain) {
    container.innerHTML = `<div id="empty">No sessions yet — waiting for the daemon…</div>`;
    reportChipRects();
    return;
  }
  container.innerHTML = plain + chips;
  reportChipRects();
}

// The strip never takes focus (see native.py's `prepare_window()`), so a
// background window's WKWebView never gets real `mouseover`/`mouseout`
// events -- hover is instead driven externally by a Python-side global mouse
// monitor (`hover_monitor.py`) doing its own point-in-rect hit-testing. It
// needs each chip's on-screen rect, since layout (and therefore position) is
// entirely our own HTML/CSS, not something Python can compute on its own.
// Guarded by `IS_POPUP_WINDOW` as a safety net on top of `updateState()`'s own
// guard below: both windows share the same `HoverMonitor` instance via the
// same `js_api` bridge, so if this ever ran in the popup window it would
// overwrite the real chip rects with an empty list (nothing in `#strip` is
// ever rendered there) and silently break hover entirely.
function reportChipRects() {
  if (IS_POPUP_WINDOW) return;
  const rects = Array.from(stripEl.querySelectorAll(".chip")).map((el) => {
    const r = el.getBoundingClientRect();
    return {
      session_name: el.dataset.session,
      left: r.left,
      top: r.top,
      width: r.width,
      height: r.height,
    };
  });
  pywebview.api.update_chip_rects(rects);
}

// Called by the Python-side hover monitor (via `evaluate_js()`) on the
// *popup* window specifically -- see `native.py`'s `prepare_popup_window()`
// for why the popup is a separate window rather than part of the strip's own
// resizable frame. Renders content, then returns the measured `[width,
// height]` (the expression this function evaluates to is what
// `evaluate_js()` hands back to Python, as a real Python list -- confirmed
// WKWebView bridges a JS array to one, not just plain numbers) so
// `hover_monitor.py` can resize the (still-hidden) popup window to fit
// before showing it.
window.__showPopupFor = function (sessionName, maxWidth) {
  const session = findSession(sessionName);
  const popup = document.getElementById("popup");
  if (!session) {
    shownPopupSession = null;
    return null;
  }
  shownPopupSession = sessionName;
  popup.innerHTML = renderPopupContent(session);
  // `maxWidth` is `hover_monitor.py`'s own `_max_popup_width()`, passed
  // fresh on every call -- the real, screen-aware amount of horizontal room
  // next to the strip, not the fixed `POPUP_MAX_WIDTH` fallback (used only
  // when called without it).
  const effectiveMaxWidth = typeof maxWidth === "number" ? maxWidth : POPUP_MAX_WIDTH;
  // Two-pass measurement. Pass 1: find the content's natural (unwrapped)
  // width via `max-content`, then clamp it ourselves, in JS, to a single
  // exact pixel number -- not left as inline `min-width`/`max-width`
  // alongside `width: max-content`. That combination measured a few pixels
  // narrower here than the *same* numeric width later resolved to once the
  // native window was actually sized to it and `#popup` fell back to its
  // stylesheet `width: 100%` -- `max-content` is an intrinsic-sizing
  // keyword, and how it composes with simultaneous `min-width`/`max-width`
  // isn't pixel-identical to clamping a plain number (confirmed empirically:
  // `getBoundingClientRect()`/`scrollWidth` read back a different value
  // after the real resize than what was measured here). A narrower width
  // wraps text differently -- enough, for a long CI check name, to need an
  // extra line that pass 1's `scrollHeight` never accounted for, clipping
  // real content past the window's bottom edge.
  popup.style.width = "max-content";
  const naturalWidth = popup.scrollWidth + POPUP_WIDTH_ROUNDING_SAFETY_MARGIN;
  popup.style.width = "";
  const width = Math.max(POPUP_MIN_WIDTH, Math.min(naturalWidth, effectiveMaxWidth));
  // Pass 2: measure height with `width` set to that *exact* pixel value --
  // the same number `resize_and_position_popup_window()` will use for the
  // real window, so wrapping (and therefore height) is measured under
  // identical conditions to the final render, with no keyword-sizing
  // ambiguity left to drift between the two. `height` is forced to `auto`
  // for the same "measure the real thing" reason -- the CSS default is
  // `100%` (see above, so the *visible* card always fills its window with no
  // gap), which would otherwise measure `scrollHeight` as at least the
  // window's current, possibly-stale size instead of the content's natural
  // one.
  popup.style.width = `${width}px`;
  popup.style.height = "auto";
  const height = Math.ceil(popup.scrollHeight);
  popup.style.width = "";
  popup.style.height = "";
  return [Math.ceil(width), height];
};

document.getElementById("popup").addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-url]");
  if (el && el.dataset.url) pywebview.api.open_url(el.dataset.url);
});

const stripEl = document.getElementById("strip");

// The window can never become key (`focus=False`, see `native.py`'s
// `prepare_window()`), so this is the *only* way session-switching happens --
// not a fallback. It still works: `WKWebView` overrides `acceptsFirstMouse:`
// to return `YES` by default, so a real click is delivered to the DOM as a
// normal event regardless of key status. Continuous hover tracking is the
// one thing that *does* require key status, which is why hover is driven
// externally via `__hoverEnter`/`__hoverLeave` above instead of a
// `mouseover`/`mouseout` listener here -- a background, never-key window's
// WKWebView never receives those at all.
stripEl.addEventListener("click", (ev) => {
  const chip = ev.target.closest(".chip");
  if (chip) pywebview.api.switch_session(chip.dataset.session);
});

// `#chip-row` (not `#strip` itself -- see its CSS above) has `overflow-x:
// auto`, so scrolling it shifts every chip's `getBoundingClientRect()`
// result exactly like a resize does -- without reporting here too, the
// hover monitor's cached rects go stale the moment the user scrolls,
// targeting whichever chip used to be at that screen position instead of
// the one now there.
document.getElementById("chip-row").addEventListener("scroll", reportChipRects);

// `bridge.py` is the single source of truth for whether the picker is
// actually open (it can close without any strip-side click at all, e.g.
// click-away via `on_picker_lost_focus()`) -- `window.__setPickerOpen()`
// below is how it syncs this button's visual state back on every open/close
// path, the same way `window.setStripMode()` already works. The click
// handler itself only ever *asks* Python to open or close; it never
// optimistically guesses the resulting state.
let pickerOpen = false;
const addToggleEl = document.getElementById("add-toggle");

window.__setPickerOpen = function (open) {
  pickerOpen = open;
  addToggleEl.classList.toggle("--open", open);
};

addToggleEl.addEventListener("click", () => {
  if (pickerOpen) {
    pywebview.api.close_project_picker();
  } else {
    pywebview.api.open_project_picker();
  }
});

// Re-renders the popup's content in place, preserving whether the
// successful-checks `<details>` was expanded -- a plain `innerHTML`
// replacement would otherwise recreate it closed every time, which made it
// look like the user's click to expand it "didn't stick" on the next daemon
// state push (the popup refreshes live while hovering, see `updateState()`).
function refreshPopupContent(session) {
  const popup = document.getElementById("popup");
  const previousDetails = popup.querySelector("details");
  popup.innerHTML = renderPopupContent(session);
  // Only force the *new* details element's state when one already existed
  // before this refresh -- if it didn't (e.g. the checks section had no
  // checks yet), there's nothing to preserve, and forcing `open = false`
  // would wrongly override `renderChecksSection()`'s own open-by-default
  // decision for a newly-arrived failed/pending check.
  if (previousDetails) {
    const details = popup.querySelector("details");
    if (details) details.open = previousDetails.open;
  }
}

function updateState(payload) {
  lastState = payload;
  // The popup window needs `lastState` (for `findSession()` in
  // `__showPopupFor`) but must never render `#strip` -- see
  // `reportChipRects()`'s own guard above for why.
  if (IS_POPUP_WINDOW) {
    // Keep an already-open popup's branch/PR/CI/agent details live instead
    // of frozen at whatever they were when the hover started -- deliberately
    // refreshes content only, not the native window's size: resizing a
    // *visible* popup window risks the same WKWebView-relayout transparency
    // flash the two-window redesign exists to avoid (see native.py's
    // `resize_and_position_popup_window()`), so growing content relies on
    // `#popup`'s own `overflow-y: auto` instead of a live resize here.
    if (shownPopupSession) {
      const session = findSession(shownPopupSession);
      if (session) {
        refreshPopupContent(session);
      } else {
        // The session this popup was showing is gone (e.g. killed) --
        // dismiss it instead of leaving stale content open indefinitely,
        // which would otherwise happen if the mouse is resting on the
        // popup itself (hover_monitor.py treats that as "stay open").
        shownPopupSession = null;
        pywebview.api.hide_popup();
      }
    }
    return;
  }
  renderStrip();
}

// ---- Context menu ----

// The context menu renders in its own separate native window (menu.html,
// see native.py's `prepare_menu_window()`), not inside this page -- the
// strip window itself is only `STRIP_HEIGHT` (56px) tall in full-width
// mode, far shorter than a multi-item menu needs, and a native window clips
// its WKWebView content to its own frame, so a menu positioned outside that
// frame simply wouldn't render. This page only builds the item list and
// hands it to Python (`show_context_menu()`) *along with this event's own
// `clientX`/`clientY`* -- not left for Python to re-query
// `NSEvent.mouseLocation()` later, which measured a noticeably stale mouse
// position in practice: `show_context_menu()` runs on pywebview's
// per-js_api-call thread, and before it can even read the mouse it first
// does a *blocking* `evaluate_js()` round-trip into the menu window to
// render and measure content height, so by the time it got around to
// querying "the current mouse position" the user had often already moved
// the mouse toward the menu. Capturing `clientX`/`clientY` synchronously,
// right here in the same event that triggered the menu, removes that gap
// entirely -- `show_context_menu()` just converts this page-relative point
// into absolute screen coordinates itself. Dismissal is handled entirely by
// `hover_monitor.py`'s poll loop once the mouse leaves that window, the
// same mechanism already used for the hover popup.
stripEl.addEventListener("contextmenu", (ev) => {
  ev.preventDefault();
  const chip = ev.target.closest(".chip");
  const items = chip
    ? [{ label: "Kill session", action: "kill", danger: true, data: { session: chip.dataset.session } }]
    : [
        {
          label: document.body.classList.contains("beside-dock")
            ? "Switch to full width"
            : "Switch to beside Dock",
          action: "toggle-mode",
        },
        { label: "Quit strip", action: "quit", danger: true },
      ];
  pywebview.api.show_context_menu(JSON.stringify(items), ev.clientX, ev.clientY);
});

document.getElementById("handle").addEventListener("click", () => {
  pywebview.api.toggle_collapse();
});

// ---- Collapsed/expanded driven purely by the native window's actual size ----
// (strip window only -- the popup window's size never changes at all, see
// native.py's `prepare_popup_window()`, and it has no collapsed state.)

if (!IS_POPUP_WINDOW) {
  function updateCollapsedClass() {
    document.body.classList.toggle("collapsed", window.innerHeight <= 20);
  }
  // `#strip` is CSS-pinned to `bottom: 0`, so a chip's on-screen position
  // shifts every time the native window resizes (now only for
  // `toggle_collapse()`, 56px <-> 10px) even though nothing re-rendered.
  // `reportChipRects()` is otherwise only called from `renderStrip()` (on
  // daemon state pushes), so without this, the hover monitor's cached chip
  // rects would go stale the instant a resize happens.
  window.addEventListener("resize", () => {
    updateCollapsedClass();
    reportChipRects();
  });
  updateCollapsedClass();
}
</script>
</body>
</html>
